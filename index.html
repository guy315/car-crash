<script>
/**
 * Web Audio API Synthesizer
 */
class SoundManager {
    constructor() {
        this.ctx = null;
        this.muted = false;
        this.engineOsc = null;
        this.engineGain = null;
    }

    init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.startEngineSound();
    }

    startEngineSound() {
        if (!this.ctx || this.engineOsc) return;

        this.engineOsc = this.ctx.createOscillator();
        this.engineGain = this.ctx.createGain();

        this.engineOsc.type = 'sawtooth';
        this.engineOsc.frequency.setValueAtTime(40, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, this.ctx.currentTime);

        this.engineGain.gain.setValueAtTime(this.muted ? 0 : 0.05, this.ctx.currentTime);

        this.engineOsc.connect(filter);
        filter.connect(this.engineGain);
        this.engineGain.connect(this.ctx.destination);

        this.engineOsc.start();
    }

    updateEngine(speedRatio) {
        if (!this.ctx || !this.engineOsc) return;
        const targetFreq = 35 + (speedRatio * 60);
        this.engineOsc.frequency.setTargetAtTime(targetFreq, this.ctx.currentTime, 0.1);
    }

    playScrape() {
        if (!this.ctx || this.muted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120 + Math.random() * 80, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playCrash() {
        if (!this.ctx || this.muted) return;

        const bufferSize = this.ctx.sampleRate * 0.8;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.8);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.8);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start();
    }

    toggleMute() {
        this.muted = !this.muted;
        if (this.engineGain) {
            this.engineGain.gain.setValueAtTime(this.muted ? 0 : 0.05, this.ctx.currentTime);
        }
        return this.muted;
    }
}

/**
 * Main Game Setup
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const sound = new SoundManager();

const STORAGE_KEY_HIGH = 'nitro_crash_highscore';
const STORAGE_KEY_CRASHES = 'nitro_crash_total_crashes';

const STATE_MENU = 0;
const STATE_PLAYING = 1;
const STATE_GAMEOVER = 2;
let gameState = STATE_MENU;

let highScore = parseInt(localStorage.getItem(STORAGE_KEY_HIGH)) || 0;
let totalCrashes = parseInt(localStorage.getItem(STORAGE_KEY_CRASHES)) || 0;

const ROAD_LEFT = 50;
const ROAD_RIGHT = 390;
const ROAD_WIDTH = ROAD_RIGHT - ROAD_LEFT;
const LANES = [100, 180, 260, 340];

let gameSpeed = 0;
const BASE_SPEED = 6;
const MAX_SPEED = 14;
let score = 0;
let distance = 0;
let shakeIntensity = 0;
let roadDashOffset = 0;

// Player Car with lowered acceleration for smooth steering
const player = {
    x: 220,
    y: 520,
    width: 36,
    height: 65,
    vx: 0,
    accel: 0.35,  // Smoother, less twitchy steering
    friction: 0.78,
    color: '#00f0ff',
    angle: 0
};

const keys = { Left: false, Right: false, Nitro: false };

let particles = [];
let skidMarks = [];
let traffic = [];

const TRAFFIC_TYPES = [
    { name: 'Sedan', width: 36, height: 60, speedOffset: 0, color: '#ff0055' },
    { name: 'Truck', width: 42, height: 95, speedOffset: -2, color: '#ffb700' },
    { name: 'Sports', width: 34, height: 55, speedOffset: 2, color: '#7000ff' },
    { name: 'Compact', width: 34, height: 50, speedOffset: 1, color: '#00ff66' }
];

const uiScore = document.getElementById('hud-score');
const uiHighScore = document.getElementById('hud-highscore');
const startModal = document.getElementById('startModal');
const gameOverModal = document.getElementById('gameOverModal');
const startHighScore = document.getElementById('start-highscore');
const startCrashes = document.getElementById('start-crashes');
const goScore = document.getElementById('go-score');
const goHighScore = document.getElementById('go-highscore');
const soundBtn = document.getElementById('soundToggle');

startHighScore.innerText = highScore;
startCrashes.innerText = totalCrashes;
uiHighScore.innerText = highScore;

window.addEventListener('keydown', e => handleKey(e, true));
window.addEventListener('keyup', e => handleKey(e, false));

function handleKey(e, isDown) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = isDown;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = isDown;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Nitro = isDown;
}

setupTouchBtn('btn-left', 'Left');
setupTouchBtn('btn-right', 'Right');
setupTouchBtn('btn-nitro', 'Nitro');

function setupTouchBtn(id, keyName) {
    const el = document.getElementById(id);
    const setKey = (val, e) => {
        e.preventDefault();
        keys[keyName] = val;
    };
    el.addEventListener('touchstart', e => setKey(true, e));
    el.addEventListener('touchend', e => setKey(false, e));
}

soundBtn.addEventListener('click', () => {
    sound.init();
    const isMuted = sound.toggleMute();
    soundBtn.innerText = isMuted ? '🔇' : '🔊';
});

document.getElementById('startBtn').addEventListener('click', () => {
    sound.init();
    startGame();
});

document.getElementById('restartBtn').addEventListener('click', () => {
    startGame();
});

function startGame() {
    gameState = STATE_PLAYING;
    score = 0;
    distance = 0;
    gameSpeed = BASE_SPEED;
    player.x = 220;
    player.vx = 0;
    player.angle = 0;
    traffic = [];
    particles = [];
    skidMarks = [];
    
    startModal.classList.add('hidden');
    gameOverModal.classList.add('hidden');
}

function triggerCrash() {
    gameState = STATE_GAMEOVER;
    shakeIntensity = 25;
    totalCrashes++;

    if (score > highScore) {
        highScore = score;
        localStorage.setItem(STORAGE_KEY_HIGH, highScore);
    }
    localStorage.setItem(STORAGE_KEY_CRASHES, totalCrashes);

    sound.playCrash();

    for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 8 + 2;
        particles.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            radius: Math.random() * 6 + 2,
            color: ['#ff0055', '#ffb700', '#ffffff', '#333'][Math.floor(Math.random() * 4)],
            life: 1,
            decay: Math.random() * 0.03 + 0.01
        });
    }

    goScore.innerText = score;
    goHighScore.innerText = highScore;
    uiHighScore.innerText = highScore;
    
    setTimeout(() => {
        gameOverModal.classList.remove('hidden');
    }, 1000);
}

function addSparks(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.random() - 0.5) * Math.PI;
        const spd = Math.random() * 6 + 2;
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 5,
            vy: Math.random() * 4 - 2,
            radius: Math.random() * 3 + 1,
            color: '#ffea00',
            life: 1,
            decay: 0.1
        });
    }
}

function addExhaustParticle() {
    particles.push({
        x: player.x + (Math.random() * 12 - 6),
        y: player.y + player.height / 2,
        vx: (Math.random() - 0.5) * 1.5,
        vy: gameSpeed * 0.5 + Math.random() * 2,
        radius: keys.Nitro ? Math.random() * 5 + 3 : Math.random() * 3 + 1,
        color: keys.Nitro ? '#00f0ff' : 'rgba(200,200,200,0.4)',
        life: 1,
        decay: keys.Nitro ? 0.05 : 0.08
    });
}

function addSkidMark() {
    skidMarks.push({
        x: player.x,
        y: player.y + player.height / 3,
        alpha: 0.3
    });
    if (skidMarks.length > 40) skidMarks.shift();
}

function spawnTraffic() {
    const minDistance = 160;
    const lane = LANES[Math.floor(Math.random() * LANES.length)];
    
    const isOccupied = traffic.some(t => Math.abs(t.x - lane) < 20 && t.y < minDistance);
    
    if (!isOccupied) {
        const type = TRAFFIC_TYPES[Math.floor(Math.random() * TRAFFIC_TYPES.length)];
        traffic.push({
            x: lane,
            y: -100,
            width: type.width,
            height: type.height,
            speed: BASE_SPEED + type.speedOffset + (Math.random() * 1.5),
            color: type.color
        });
    }
}

/**
 * Update Loop
 */
function update() {
    if (shakeIntensity > 0) shakeIntensity *= 0.9;

    if (gameState !== STATE_PLAYING) {
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
        });
        particles = particles.filter(p => p.life > 0);
        return;
    }

    const targetSpeed = keys.Nitro ? MAX_SPEED : BASE_SPEED + Math.min(distance / 500, 4);
    gameSpeed += (targetSpeed - gameSpeed) * 0.1;
    
    distance += gameSpeed * 0.05;
    score = Math.floor(distance);
    uiScore.innerText = score;

    sound.updateEngine(gameSpeed / MAX_SPEED);

    roadDashOffset = (roadDashOffset + gameSpeed) % 40;

    // Smoother Steering physics
    if (keys.Left) player.vx -= player.accel;
    if (keys.Right) player.vx += player.accel;

    player.vx *= player.friction;
    player.x += player.vx;
    player.angle = player.vx * 0.04;

    if (Math.abs(player.vx) > 2) addSkidMark();

    // Road Border Collision (Instant crash on outer walls)
    if (player.x - player.width / 2 < ROAD_LEFT || player.x + player.width / 2 > ROAD_RIGHT) {
        triggerCrash();
    }

    if (Math.random() < 0.6) addExhaustParticle();

    if (Math.random() < 0.025 + (gameSpeed * 0.001)) {
        spawnTraffic();
    }

    // NPC Intelligence: Stop cars from running through each other
    for (let i = 0; i < traffic.length; i++) {
        let t1 = traffic[i];
        for (let j = 0; j < traffic.length; j++) {
            if (i === j) continue;
            let t2 = traffic[j];
            // If in same lane and t2 is directly ahead of t1
            if (Math.abs(t1.x - t2.x) < 20 && t2.y > t1.y && (t2.y - t1.y) < 110) {
                t1.speed = Math.min(t1.speed, t2.speed - 0.2);
            }
        }
    }

    // Process Traffic Movement & Player Collisions
    for (let i = traffic.length - 1; i >= 0; i--) {
        let t = traffic[i];
        t.y += gameSpeed - t.speed * 0.4;

        // Collision Check
        const pLeft = player.x - player.width / 2;
        const pRight = player.x + player.width / 2;
        const pTop = player.y - player.height / 2;
        const pBottom = player.y + player.height / 2;

        const tLeft = t.x - t.width / 2;
        const tRight = t.x + t.width / 2;
        const tTop = t.y - t.height / 2;
        const tBottom = t.y + t.height / 2;

        if (pRight > tLeft && pLeft < tRight && pBottom > tTop && pTop < tBottom) {
            // Determine side overlap vs vertical overlap
            const overlapX = Math.min(pRight - tLeft, tRight - pLeft);
            const overlapY = Math.min(pBottom - tTop, tBottom - pTop);

            // Side Scrape Condition (X overlap is smaller than Y overlap)
            if (overlapX < overlapY && overlapX < 14) {
                // Bounce Player Away
                if (player.x < t.x) {
                    player.x -= overlapX;
                    player.vx = -3;
                    addSparks(tLeft, player.y);
                } else {
                    player.x += overlapX;
                    player.vx = 3;
                    addSparks(tRight, player.y);
                }

                gameSpeed = Math.max(BASE_SPEED, gameSpeed - 1.5); // Minor speed bump
                shakeIntensity = 5;
                sound.playScrape();
            } else {
                // Front / Back Direct Collision -> Wreck
                triggerCrash();
            }
        }

        if (t.y > canvas.height + 100) {
            traffic.splice(i, 1);
        }
    }

    skidMarks.forEach(s => {
        s.y += gameSpeed;
        s.alpha -= 0.008;
    });
    skidMarks = skidMarks.filter(s => s.alpha > 0);

    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy + (gameSpeed * 0.2);
        p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);
}

/**
 * Render Loop
 */
function draw() {
    ctx.save();

    if (shakeIntensity > 0.5) {
        ctx.translate(
            (Math.random() - 0.5) * shakeIntensity,
            (Math.random() - 0.5) * shakeIntensity
        );
    }

    ctx.fillStyle = '#11151c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#1e2330';
    ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, canvas.height);

    ctx.fillStyle = '#141822';
    ctx.fillRect(0, 0, ROAD_LEFT, canvas.height);
    ctx.fillRect(ROAD_RIGHT, 0, canvas.width - ROAD_RIGHT, canvas.height);

    const stripHeight = 20;
    const stripOffset = (roadDashOffset * 1.5) % (stripHeight * 2);
    for (let y = -stripHeight * 2; y < canvas.height + stripHeight; y += stripHeight) {
        ctx.fillStyle = (Math.floor((y + stripOffset) / stripHeight) % 2 === 0) ? '#ff0055' : '#ffffff';
        ctx.fillRect(ROAD_LEFT - 6, y + stripOffset, 6, stripHeight);
        ctx.fillRect(ROAD_RIGHT, y + stripOffset, 6, stripHeight);
    }

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 3;
    ctx.setLineDash([20, 20]);
    ctx.lineDashOffset = -roadDashOffset;

    for (let i = 1; i < LANES.length; i++) {
        const laneX = ROAD_LEFT + (i * (ROAD_WIDTH / LANES.length));
        ctx.beginPath();
        ctx.moveTo(laneX, 0);
        ctx.lineTo(laneX, canvas.height);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    skidMarks.forEach(s => {
        ctx.fillStyle = `rgba(0, 0, 0, ${s.alpha})`;
        ctx.fillRect(s.x - 12, s.y, 6, 12);
        ctx.fillRect(s.x + 6, s.y, 6, 12);
    });

    traffic.forEach(t => {
        drawCar(t.x, t.y, t.width, t.height, t.color, 0, false);
    });

    if (gameState === STATE_PLAYING || (gameState === STATE_GAMEOVER && shakeIntensity > 5)) {
        drawCar(player.x, player.y, player.width, player.height, player.color, player.angle, true);
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    ctx.restore();
}

function drawCar(x, y, width, height, color, angle = 0, isPlayer = false) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(-width/2 + 3, -height/2 + 3, width, height);

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-width/2, -height/2, width, height, 6);
    ctx.fill();

    ctx.fillStyle = '#0a0d14';
    ctx.beginPath();
    ctx.roundRect(-width/2 + 4, -height/2 + 14, width - 8, height - 28, 4);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(-width/2 + 6, -height/2 + 18);
    ctx.lineTo(width/2 - 6, -height/2 + 18);
    ctx.lineTo(width/2 - 8, -height/2 + 28);
    ctx.lineTo(-width/2 + 8, -height/2 + 28);
    ctx.fill();

    if (isPlayer) {
        ctx.fillStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 10;
        ctx.fillRect(-width/2 + 3, -height/2, 6, 3);
        ctx.fillRect(width/2 - 9, -height/2, 6, 3);

        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 8;
        ctx.fillRect(-width/2 + 4, height/2 - 3, 7, 3);
        ctx.fillRect(width/2 - 11, height/2 - 3, 7, 3);
    } else {
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(-width/2 + 4, -height/2, 6, 2);
        ctx.fillRect(width/2 - 10, -height/2, 6, 2);
    }

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
